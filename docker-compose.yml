services:
  postgres:
    image: postgres:16-alpine
    container_name: spotter-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-spotter}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-spotter}
      POSTGRES_DB: ${POSTGRES_DB:-spotter_freight}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - spotter_pg_data:/var/lib/postgresql/data
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  spotter_pg_data:
